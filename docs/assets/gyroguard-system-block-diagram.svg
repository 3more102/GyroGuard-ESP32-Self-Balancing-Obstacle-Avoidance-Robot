<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-label="GyroGuard ESP32 robot system architecture diagram showing MPU6050 and servo-mounted HC-SR04 input, ESP32 tilt estimation and balance control, TB6612FNG motor driver, two geared motors and power distribution">
