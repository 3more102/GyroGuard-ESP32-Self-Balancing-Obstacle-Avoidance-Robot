name: ESP32 firmware and safety regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-safety-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run controller, sonar and firmware syntax checks
        run: bash test/host/run_tests.sh

  esp32-firmware-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Verify safe motor and autonomy defaults
        run: |
          grep -Eq '^[[:space:]]*-D[[:space:]]+GYROGUARD_AUTONOMY=0([[:space:]]|$)' platformio.ini
          grep -Eq '^[[:space:]]*-D[[:space:]]+GYROGUARD_MOTOR_ENABLE=0([[:space:]]|$)' platformio.ini
      - name: Build ESP32-WROOM-32 firmware
        run: pio run -e esp32dev
      - name: Build opt-in wheel encoder monitoring firmware
        run: pio run -e esp32dev-encoder-monitor
      - name: Preserve firmware for bench flashing
        uses: actions/upload-artifact@v4
        with:
          name: gyroguard-esp32-firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
          if-no-files-found: error
