name: ESP32 firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  esp32-platformio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Verify safety-default compilation flag
        run: grep -Eq '^[[:space:]]*-D[[:space:]]+GYROGUARD_AUTONOMY=0([[:space:]]|$)' platformio.ini
      - name: Compile ESP32 firmware (no flashing)
        run: python -m platformio run -e esp32dev
